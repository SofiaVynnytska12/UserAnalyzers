databaseChangeLog:
  - changeSet:
      id: 1
      author: svitlana
      changes:
        - createTable:
            tableName: login_events
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column: { name: event_type, type: varchar(50) }
              - column: { name: user_id, type: int }
              - column: { name: username, type: varchar(100) }
              - column: { name: email, type: varchar(100) }
              - column: { name: country, type: varchar(50) }
              - column: { name: timestamp, type: timestamp }

  - changeSet:
      id: 2
      author: svitlana
      changes:
        - createTable:
            tableName: click_events
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column: { name: event_type, type: varchar(50) }
              - column: { name: user_id, type: int }
              - column: { name: element_id, type: varchar(100) }
              - column: { name: page_url, type: varchar(200) }
              - column: { name: timestamp, type: timestamp }
              - column: { name: post_id, type: int }

  - changeSet:
      id: 3
      author: svitlana
      changes:
        - insert:
            tableName: login_events
            columns:
              - column: { name: event_type, value: login }
              - column: { name: user_id, value: 101 }
              - column: { name: username, value: alice }
              - column: { name: email, value: alice@example.com }
              - column: { name: country, value: Ukraine }
              - column: { name: timestamp, valueDate: 2025-03-25T10:00:00 }

        - insert:
            tableName: login_events
            columns:
              - column: { name: event_type, value: login }
