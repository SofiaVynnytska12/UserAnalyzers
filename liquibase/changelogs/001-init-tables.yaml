              - column: { name: country, value: Poland }
              - column: { name: timestamp, valueDate: 2025-03-25T10:05:00 }

  - changeSet:
      id: 4
      author: svitlana
      changes:
        - insert:
            tableName: click_events
            columns:
              - column: { name: event_type, value: click }
